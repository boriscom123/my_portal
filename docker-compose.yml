# Портал видеоуроков.
#
# Файл самодостаточен: на чистой машине `docker compose --profile standalone up -d`
# поднимает приложение вместе со своей базой и публикует порт наружу.
#
# На этом VPS профиль standalone не включается: база живёт в общем слое
# (ClaudeDocker), порт наружу не публикуется, вход держит общий nginx.
# Оверлей подключается строкой COMPOSE_FILE в .env — см. .env.example.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3004
    # Своя база и очередь, если они подняты этим же компоузом. На VPS обе
    # внешние, профиль standalone не включён — и зависимость отключённого
    # профиля compose пропускает. Без неё первый запуск гонится с базой: api
    # падает и поднимается заново, а первая уборка буфера уходит в ошибку.
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
    ports:
      - "${APP_PORT:-3004}:3004"
    # Журнал не бесконечен. Без этих строк docker пишет его без края: у
    # соседнего контейнера он однажды доел диск, а заметно это становится
    # переполнением, а не предупреждением.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      # Буфер общий с воркером: api принимает загрузку, воркер её обрабатывает.
      - portal_media:/app/media

  # Обработка уроков: расшифровка, субтитры, нарезки. Тот же образ, другая
  # команда — воркер не слушает порт, он разбирает очередь.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["node", "src/worker.js"]
    # Журнал не бесконечен. Без этих строк docker пишет его без края: у
    # соседнего контейнера он однажды доел диск, а заметно это становится
    # переполнением, а не предупреждением.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # Потолок памяти — предохранитель, а не осторожность. 7 сентября 2026
    # расшифровка часового урока легла поверх уже занятых двух с половиной
    # гигабайт: свободной памяти осталось 76 МБ, ядро выбросило дисковый кеш и
    # ушло перечитывать его с диска. Сервер не отвечал восемь часов, до
    # перезагрузки руками. Считать при этом было нечего: полтораста процессов
    # ждали диск, а не ядро.
    #
    # С потолком та же беда кончается иначе: ядро убивает whisper внутри
    # контейнера, урок падает с понятной причиной и кнопкой «Повторить», а
    # машина и соседние проекты живут.
    #
    # 1.4 ГБ — это замеренные 0.93 ГБ, которые whisper держит на часовой
    # записи (модель 190 МБ плюс весь звук в памяти), и запас на сам воркер с
    # ffmpeg. Меньше нельзя: часовой урок перестанет расшифровываться вовсе.
    mem_limit: 1400m
    # Своп на машине 512 МБ. Без этой строки контейнеру достаётся ещё столько
    # же памяти свопом — то есть та же тяга всей машины на диск, от которой
    # потолок и ставится.
    memswap_limit: 1400m
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
    volumes:
      - portal_media:/app/media
      # Модель распознавания: 182 МБ, качаются один раз и переживают
      # пересборку образа. В образ не кладём — иначе их тянула бы каждая сборка.
      - portal_models:/app/models

  # Своя база и своя очередь — только для запуска на отдельной машине. На VPS
  # их заменяют общие postgres и redis из слоя ClaudeDocker: держать вторые
  # экземпляры на 3.8 ГБ памяти незачем.
  db:
    image: postgres:18-alpine
    profiles: [standalone]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - portal_db:/var/lib/postgresql
    # Проверка готовности, а не факта запуска: контейнер поднимается за
    # полсекунды, а принимать подключения postgres начинает через несколько.
    # Без неё первый запуск гонится с базой — api падает и встаёт заново, а
    # первая уборка буфера уходит в ошибку.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Очередь конвейера. Без неё воркер не поднимается вовсе, поэтому в профиле
  # standalone она обязана быть: иначе установка «с нуля» даёт работающую
  # витрину и воркер в вечном перезапуске.
  # Задачи хранить незачем — упавшую обработку повторяет автор кнопкой, а
  # выключенное сохранение бережёт диск и не роняет запуск при пересборке.
  redis:
    image: redis:8-alpine
    profiles: [standalone]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # Свой сервер Telegram Bot API для чистой машины: с ним бот шлёт в канал
  # видео до 2000 МБ, а не до 50. На VPS его даёт ClaudeService (глобальный
  # для всех ботов), и профиль standalone там не включается. Адрес для
  # портала здесь — http://telegram-bot-api:8081 (TELEGRAM_API_URL).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    profiles: [standalone]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - portal_telegram_bot_api:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  portal_db:
  portal_media:
  portal_models:
  portal_telegram_bot_api:
